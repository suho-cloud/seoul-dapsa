<style>
:root{--ink:#1D2830;--muted:#5D6A70;--line:#D3DAD7;--paper:#FFFFFF;--bg:#F1F4F1;
  --f-d:"Nanum Myeongjo",serif;--f-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-m:"IBM Plex Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-b);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.55}
#app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
#mapwrap{position:relative;min-height:0}
#map{width:100%;height:100%}
#panel{overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:18px 16px 40px;display:grid;gap:14px;align-content:start}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}#mapwrap{height:62vh}#panel{border-left:0;border-top:1px solid var(--line)}}
h1{font-family:var(--f-d);font-size:22px;line-height:1.3;margin:0}
.eyebrow{font-family:var(--f-m);font-size:11px;color:var(--muted);letter-spacing:.04em}
.note{font-size:12.5px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.note b{color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{font:500 12.5px var(--f-b);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btns button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{display:flex;min-height:28px;flex:none;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.seg{display:flex;align-items:center;justify-content:center;padding:0 3px;font-size:11px;line-height:1.2;color:#fff;background:var(--c);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid #fff;text-align:center}
.seg.mute{background:#C9D1CE;color:var(--ink)}
.zhead{border-left:4px solid var(--c);padding-left:10px;margin-top:8px}
.zhead b{font-family:var(--f-d);font-size:17px;color:var(--c);display:block}
.zhead span{font-size:12.5px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;cursor:pointer}
.card.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.ct{display:flex;gap:8px;align-items:center}
.num{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-m);border:2px solid var(--c);background:var(--c);color:#fff}
.num.pass{background:#fff;color:var(--c);border-style:dashed}
.cn{font-weight:600}
.ctime{margin-left:auto;font:500 11.5px var(--f-m);color:var(--muted);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:0 7px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
.tag.iv{background:var(--c);color:#fff}
.card ul{margin:0;padding-left:17px;font-size:13.5px;display:grid;gap:2px}
.q{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.links{display:flex;gap:12px;font-size:12.5px}
.links a{color:var(--c);font-weight:500}
.walk{font:500 11.5px var(--f-m);color:var(--muted);padding-left:12px;border-left:2px dotted var(--line);margin-left:11px}
.gap{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px 12px}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--f-m);border:2.5px solid #fff;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.mk.pass{background:#fff;color:var(--c);border:2.5px dashed var(--c)}
.mk.on{transform:scale(1.3)}
.mkl{font:600 12px var(--f-b);color:var(--ink);background:rgba(255,255,255,.94);padding:1px 6px;border-radius:3px;margin-top:3px;white-space:nowrap;text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
#err{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);padding:24px}
#err[hidden]{display:none}
#err div{max-width:520px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 22px}
#err h2{margin:0 0 8px;font-family:var(--f-d);font-size:19px}
#err code{font-family:var(--f-m);background:var(--bg);padding:1px 5px;border-radius:3px}
.sub{font-size:13px;color:var(--muted);margin-top:-6px}
.walk span{font-family:var(--f-b);font-size:12px}
.pk{width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px dashed var(--c);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mkl.pl{font-weight:500;font-size:11px;color:var(--muted)}
.ctime{text-align:right;line-height:1.3}
</style>
</head>

function len(l){let d=0;for(let i=1;i<l.length;i++){const a=l[i-1],b=l[i],x=(b[1]-a[1])*Math.PI/180*Math.cos((a[0]+b[0])/2*Math.PI/180),y=(b[0]-a[0])*Math.PI/180;d+=6371000*Math.hypot(x,y);}return d;}
const pathOf=keys=>keys.flatMap((k,i)=>i?P[k].slice(1):P[k]);

/* ---------- 지도 ---------- */
let map,mks={},cur=null;
function init(){
  const K=kakao.maps,LL=(a,b)=>new K.LatLng(a,b);
  map=new K.Map(document.getElementById('map'),{center:LL(37.5715,126.9880),level:5});
  map.addControl(new K.MapTypeControl(),K.ControlPosition.TOPRIGHT);
  map.addControl(new K.ZoomControl(),K.ControlPosition.RIGHT);
  const all=new K.LatLngBounds();
  const draw=(pts,col,inside)=>{const path=pts.map(p=>LL(p[0],p[1]));path.forEach(p=>all.extend(p));
    new K.Polyline({map,path,strokeWeight:inside?7:9,strokeColor:'#FFFFFF',strokeOpacity:.9,zIndex:1});
    new K.Polyline({map,path,strokeWeight:inside?3:5,strokeColor:col,strokeOpacity:1,strokeStyle:inside?'shortdot':'solid',endArrow:true,zIndex:2});};
  S.forEach(s=>{if(s.walk)draw(pathOf(s.walk.keys),ZC[s.walk.z||s.z],false);if(s.inside)draw(pathOf(s.inside.keys),ZC[s.z],true);});
  PASS.forEach(p=>{const w=document.createElement('div');w.style.cssText='display:grid;justify-items:center';
    w.innerHTML=`<div class="pk" style="--c:${ZC[p.z]}"></div><div class="mkl pl">${p.name}</div>`;
    new K.CustomOverlay({map,position:LL(p.lat,p.lng),content:w,yAnchor:.15,zIndex:3});});
  S.forEach(s=>{const w=document.createElement('div');w.style.cssText='display:grid;justify-items:center';
    const m=document.createElement('div');m.className='mk';m.style.setProperty('--c',ZC[s.z]);m.textContent=s.id;m.title=s.name;
    const l=document.createElement('div');l.className='mkl';l.textContent=s.short;w.append(m,l);
    w.addEventListener('click',()=>select(s.id,true));
    new K.CustomOverlay({map,position:LL(s.lat,s.lng),content:w,yAnchor:.25,zIndex:4});mks[s.id]=m;});
  const fit=v=>{if(v==='all'){map.setBounds(all,40,40,40,40);return;}map.setBounds(new K.LatLngBounds(LL(...VIEWS[v][0]),LL(...VIEWS[v][1])));};
  fit('all');
  document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>fit(b.dataset.v)));
  document.querySelectorAll('#layers button').forEach(b=>b.addEventListener('click',()=>{
    const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);
    on?map.addOverlayMapTypeId(K.MapTypeId[b.dataset.t]):map.removeOverlayMapTypeId(K.MapTypeId[b.dataset.t]);}));
}
function select(id,scroll){
  if(cur){cards[cur].classList.remove('on');mks[cur]&&mks[cur].classList.remove('on');}
  cur=id;cards[id].classList.add('on');if(mks[id])mks[id].classList.add('on');
  const s=S.find(x=>x.id===id);if(map){map.setLevel(Math.min(map.getLevel(),4));map.panTo(new kakao.maps.LatLng(s.lat,s.lng));}
  if(scroll)cards[id].scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- SDK ---------- */
if(location.protocol==='file:')showErr('file');
else{const sc=document.createElement('script');
  sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
  sc.onload=()=>{try{kakao.maps.load(init)}catch(e){showErr('load')}};
  sc.onerror=()=>showErr('load');document.head.appendChild(sc);}
</script>
