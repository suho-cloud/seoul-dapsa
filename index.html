<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11·3 서울 도심 답사 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ================================================================
   ★ 바꿀 곳은 하나뿐입니다 ★  아래 스크립트 맨 위의 KAKAO_JS_KEY 값
   ================================================================ */
:root{--ink:#1D2830;--muted:#5D6A70;--line:#D3DAD7;--paper:#FFFFFF;--bg:#F1F4F1;
  --zA:#6E7E35;--zB:#2E8A7E;--zC:#B47A1E;--zD:#C24E3E;--zE:#2F70B0;--zF:#A84E86;
  --f-d:"Nanum Myeongjo",serif;--f-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-m:"IBM Plex Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-b);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.55}
#app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
#mapwrap{position:relative;min-height:0}
#map{width:100%;height:100%}
#panel{overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:18px 16px 40px;display:grid;gap:16px;align-content:start}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}#mapwrap{height:62vh}#panel{border-left:0;border-top:1px solid var(--line)}}
h1{font-family:var(--f-d);font-size:22px;line-height:1.3;margin:0}
.eyebrow{font-family:var(--f-m);font-size:11px;color:var(--muted);letter-spacing:.05em}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layers button{font:500 12.5px var(--f-b);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.layers button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{display:flex;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.seg{padding:5px 4px;font-size:10.5px;line-height:1.2;color:#fff;background:var(--c);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid #fff}
.seg.mute{background:#C9D1CE;color:var(--ink)}
.zhead{border-left:4px solid var(--c);padding-left:10px;margin-top:6px}
.zhead b{font-family:var(--f-d);font-size:17px;color:var(--c);display:block}
.zhead span{font-size:12.5px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;cursor:pointer}
.card.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.ct{display:flex;gap:8px;align-items:center}
.num{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-m);border:2px solid var(--ink);background:#fff}
.num.prof{background:var(--ink);color:#fff}.num.opt{border-style:dashed}
.cn{font-weight:600}
.ctime{margin-left:auto;font:500 11.5px var(--f-m);color:var(--muted)}
.card ul{margin:0;padding-left:17px;font-size:13.5px;display:grid;gap:2px}
.q{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.links{display:flex;gap:12px;font-size:12.5px}
.links a{color:var(--c);font-weight:500}
.lunch{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px 12px}
/* 지도 위 오버레이 */
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-m);border:2.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mk.prof{background:var(--ink);color:#fff}.mk.opt{border-style:dashed}
.mk.on{transform:scale(1.3);border-color:var(--zD)}
.mkl{font:600 12px var(--f-b);color:var(--ink);background:rgba(255,255,255,.92);padding:1px 6px;border-radius:3px;margin-top:3px;white-space:nowrap;text-align:center}
.zl{font:700 12.5px var(--f-b);color:var(--c);background:rgba(255,255,255,.9);padding:2px 7px;border-radius:3px;border:1px solid var(--c);white-space:nowrap;transform:translate(6px,6px)}
#err{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);padding:24px}
#err[hidden]{display:none}
#err div{max-width:520px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 22px;display:grid;gap:8px}
#err h2{margin:0;font-family:var(--f-d);font-size:19px}
#err code{font-family:var(--f-m);background:var(--bg);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap"><div id="map"></div><div id="err" hidden><div id="errbox"></div></div></div>
  <aside id="panel">
    <div class="eyebrow">공주대 지리학과 답사부 · 2026.11.3(화) · 07:00 출발 → 18:00 종료</div>

        <button data-t="TERRAIN" aria-pressed="false">지형도</button>
        <button data-t="ROADVIEW" aria-pressed="false">로드뷰 도로</button>
        <button data-t="ZONES" aria-pressed="true">답사 구역</button>
      </div>
    </div>
    <div id="list" style="display:grid;gap:10px"></div>
  </aside>
</div>

 A:{name:"A 북촌·삼청 ★",time:"08:30–10:45 · 2시간 15분",desc:"레드존 개방(10시) 전 바깥 골목, 10시 이후 가회동 핵심부",r:[[37.5790,37.5856,126.9788,126.9905]]},

 {n:1,z:"A",t:"prof",name:"삼청동길 · 국립현대미술관 서울관 앞",short:"삼청동길",lat:37.5838,lng:126.9814,time:"08:30–09:05",

  q:"공실·임대 안내문 수를 세어 상권이 어느 단계인지 판단해 보기."},
 {n:2,z:"A",t:"prof",name:"계동길 · 원서동 (레드존 바깥)",short:"계동길·원서동",lat:37.5808,lng:126.9878,time:"09:05–09:55",
  pts:["중앙고등학교로 이어지는 골목 상권. 오래된 생활 업종과 새 카페·브랜드 매장이 섞인 업종 교체 현장.","원서동은 창덕궁 서쪽 담장과 맞닿은 한옥 주거지. 궁궐 담장이 만드는 높이·경관 규제 관찰.","오렌지존. 레드존과 인파·안내판·업종 비교."],
  q:"같은 북촌 안에서 관광객이 몰리는 곳과 아닌 곳을 가르는 요인은? (경사, 접근성, SNS 촬영지)"},
 {n:3,z:"A",t:"prof",name:"가회동 31번지 · 북촌로11길 (레드존)",short:"가회동 레드존",lat:37.58253,lng:126.98365,time:"10:00–10:45",
  pts:["10:00 개방에 맞춰 진입. 관광진흥법상 첫 특별관리지역 레드존, 위반 시 과태료 10만원.","한옥체험업 2020년 47곳 → 2026년 168곳. 종로구가 신규 등록 제한 검토.","1920~30년대 큰 필지를 쪼개 지은 도시형 한옥 단지. 필지·골목 위계 관찰.","북촌보안관·안내판 등 관리 장치의 배치 기록."],

  pts:["왕족·세도가 주거지 → 조선식산은행 사택 → 미군·미대사관 숙소 → 2022년 개방.","서울광장의 약 3배. 일부에 이건희 기증관 예정."],q:"도심의 빈 땅은 무엇이 되어야 하나?"},
 {n:5,z:"B",t:"add",name:"익선동 한옥거리",short:"익선동",lat:37.57371,lng:126.99013,time:"11:00–11:40",
  pts:["1920년대 정세권이 개발한 도시형 한옥 단지. 가회동과 직접 비교.","2004년 재개발구역 지정 → 2014년 해제 → 몇 년 만에 카페·식당 거리로.","조별 과제: 골목별 업종, 지붕·외벽 개조, 남은 거주 흔적(문패·우편함) 기록."],
  q:"주거지에서 소비 공간으로 바뀐 한옥에서 보존된 것은 건물인가, 동네인가?"},
 {n:6,z:"B",t:"add",name:"낙원상가",short:"낙원상가",lat:37.57267,lng:126.98781,time:"11:40–12:00",
  pts:["1969년 삼일대로 위에 지은 도로 위 주상복합.","철거 대신 존치된 사례. 오후 세운상가와 비교 기준."],q:"이런 구조가 왜 1960년대에 등장했을까?"},
 {n:7,z:"C",t:"prof",name:"서순라길",short:"서순라길",lat:37.57429,lng:126.99237,time:"13:00–13:50",
  pts:["종묘 서쪽 담장을 따라 북쪽에서 종로 쪽으로 내려오기. 조선 순라군 순찰로에서 유래한 이름.","귀금속 세공 공방과 새 한옥 카페가 한 길에 공존."],q:"세계유산 담장 옆 건물의 높이·간판 규제는?"},
 {n:8,z:"C",t:"prof",name:"종로3가 귀금속거리 · 탑골공원",short:"귀금속거리·탑골",lat:37.5711,lng:126.9905,time:"13:50–14:35",
  pts:["국내 최대 규모 귀금속 도·소매·세공 집적지. 집적 경제의 실제 모습.","탑골공원 주변은 고령층의 도심 여가 공간."],q:"재개발되면 공방과 고령층은 어디로 가게 될까?"},
 {n:9,z:"C",t:"prof",name:"종묘광장공원 · 종묘 외대문 앞",short:"종묘 정문 앞",lat:37.5717,lng:126.9942,time:"14:35–15:10",
  pts:["종로 건너편 세운4구역 부지를 종묘 쪽에서 먼저 바라보기. 최단 거리 약 180m.","장기·바둑을 두는 고령층 모임 공간."],q:"여기서 140m 건물이 보인다면? 다음 지점에서 반대 방향으로 확인."},
 {n:10,z:"D",t:"add",name:"세운상가 · 옥상에서 본 세운4구역",short:"세운상가",lat:37.56971,lng:126.99522,time:"15:10–16:20",
  pts:["15:10–15:40 상가 내부: 전자·공구·부품 점포로 도심 제조업 생태계 확인.","1968년 국내 첫 대형 주상복합 → 쇠퇴 → 2009년 철거 계획 → ‘다시세운’ 재생 → 다시 녹지축 철거 계획.","15:40–16:20 옥상 토론: 4구역 최고 높이 종로변 55→98.7m, 청계천변 71.9→141.9m. 국가유산청은 재검토 요구."],
  q:"찬반 두 조 5분 발표: ‘녹지생태도심’ 대 ‘세계유산 경관’."},
 {n:11,z:"E",t:"prof",name:"청계천 (세운교~관수교) — 박종철 교수님",short:"청계천",lat:37.56861,lng:126.99533,time:"16:20–16:55",
  pts:["1950~70년대 복개, 1971년 청계고가 → 2003~2005년 복원.","북쪽 조선인 중심 북촌과 남쪽 일본인 중심 남촌의 경계. 오늘 동선이 이 경계를 건너는 순간."],q:"물은 어디서 오나? 복원의 ‘진정성’ 논쟁."},
 {n:12,z:"E",t:"opt",name:"을지로3가 인쇄·공구 골목 (통과)",short:"을지로 골목",lat:37.56587,lng:126.99219,time:"16:55–17:10",
  pts:["골목 공장, 힙지로 상권, 재개발로 사라지는 노포가 한 블록에 공존."],q:""},
 {n:13,z:"F",t:"prof",name:"명동 거리",short:"명동",lat:37.56419,lng:126.98612,time:"17:10–18:00",

  q:"명동은 ‘관광객의 거리’로 바뀌었나? 조별 집계 비교."},
 {n:14,z:"F",t:"prof",name:"저녁 식사 · 버스 승차",short:"저녁·버스",lat:37.5605,lng:126.9835,time:"18:00~",

];

/* ---------- 패널(지도 없이도 보임) ---------- */
const tl=document.getElementById('tl');
TL.forEach(([n,m,z])=>{const d=document.createElement('div');d.className='seg'+(z?'':' mute');d.style.flex=m+' 1 0';if(z)d.style.setProperty('--c',ZC[z]);d.textContent=n;d.title=n;tl.appendChild(d);});
const list=document.getElementById('list');const cards={};
for(const k in ZONES){const z=ZONES[k];
  const h=document.createElement('div');h.className='zhead';h.style.setProperty('--c',ZC[k]);
  h.innerHTML=`<b>${z.name}</b><span>${z.time} — ${z.desc}</span>`;list.appendChild(h);
  S.filter(s=>s.z===k).forEach(s=>{const c=document.createElement('div');c.className='card';c.style.setProperty('--c',ZC[k]);
    const nm=encodeURIComponent(s.short);
    c.innerHTML=`<div class="ct"><span class="num ${s.t}">${s.n}</span><span class="cn">${s.name}</span><span class="ctime">${s.time}</span></div>
      <ul>${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${s.q?`<div class="q"><b>토론·관찰</b> ${s.q}</div>`:''}
      <div class="links"><a href="https://map.kakao.com/link/map/${nm},${s.lat},${s.lng}" target="_blank" rel="noopener">카카오맵에서 보기</a><a href="https://map.kakao.com/link/to/${nm},${s.lat},${s.lng}" target="_blank" rel="noopener">여기로 길찾기</a></div>`;
    c.addEventListener('click',e=>{if(e.target.tagName!=='A')select(s.n,false)});cards[s.n]=c;list.appendChild(c);});
  if(k==='B'){const l=document.createElement('div');l.className='lunch';l.textContent='12:00–13:00 점심 · 낙원동~종로3가 일대 단체 식당 (사전 예약 권장)';list.appendChild(l);}
}

/* ---------- 오류 안내 ---------- */
function showErr(type){
  const box=document.getElementById('errbox');document.getElementById('err').hidden=false;
  const msg={
   key:`<h2>카카오 키가 아직 없습니다</h2><p>이 파일을 메모장으로 열어 <code>YOUR_KAKAO_JS_KEY</code>를 카카오 디벨로퍼스의 <b>JavaScript 키</b>로 바꿔 저장하세요.</p><p>오른쪽 목록과 카카오맵 링크는 키 없이도 쓸 수 있습니다.</p>`,
   file:`<h2>파일을 더블클릭해서 열면 지도가 뜨지 않습니다</h2><p>카카오 지도는 등록된 주소에서만 작동합니다. 이 폴더에서 <code>python -m http.server 8000</code>을 실행한 뒤 <code>http://localhost:8000</code>으로 여세요. 또는 GitHub Pages 주소로 여세요.</p>`,
   load:`<h2>카카오 지도를 불러오지 못했습니다</h2><p>확인할 것 세 가지:</p><p>① 카카오 디벨로퍼스에서 <b>카카오맵 사용 설정이 ON</b>인지<br>② 지금 주소 <code>${location.origin}</code>가 <b>JavaScript 키 아래 도메인</b>에 정확히 등록돼 있는지<br>③ 키를 JavaScript 키로 넣었는지 (REST API 키 아님)</p>`
  }[type];box.innerHTML=msg;}

/* ---------- 지도 ---------- */
let map,mks={},zoneObjs=[],cur=null;
function init(){
  const K=kakao.maps,LL=(a,b)=>new K.LatLng(a,b);
  map=new K.Map(document.getElementById('map'),{center:LL(37.5728,126.9880),level:5});
  map.addControl(new K.MapTypeControl(),K.ControlPosition.TOPRIGHT);
  map.addControl(new K.ZoomControl(),K.ControlPosition.RIGHT);
  for(const k in ZONES){const z=ZONES[k],c=ZC[k];
    z.r.forEach(([la1,la2,ln1,ln2])=>{zoneObjs.push(new K.Polygon({map,path:[LL(la2,ln1),LL(la2,ln2),LL(la1,ln2),LL(la1,ln1)],strokeWeight:2,strokeColor:c,strokeOpacity:.9,strokeStyle:'dash',fillColor:c,fillOpacity:.12}));});
    const [la1,la2,ln1]=z.r[0];
    zoneObjs.push(new K.CustomOverlay({map,position:LL(la2,ln1),content:`<div class="zl" style="--c:${c}">${z.name}</div>`,xAnchor:0,yAnchor:0,zIndex:1}));
  }
  for(let i=0;i<S.length-1;i++){const a=S[i],b=S[i+1];
    new K.Polyline({map,path:[LL(a.lat,a.lng),LL(b.lat,b.lng)],strokeWeight:4,strokeColor:'#1D2830',strokeOpacity:.85,endArrow:true,zIndex:2});}
  S.forEach(s=>{const w=document.createElement('div');w.style.cssText='display:grid;justify-items:center';
    const m=document.createElement('div');m.className='mk '+s.t;m.textContent=s.n;m.title=s.name;
    const l=document.createElement('div');l.className='mkl';l.textContent=s.short;w.append(m,l);
    w.addEventListener('click',()=>select(s.n,true));
    new K.CustomOverlay({map,position:LL(s.lat,s.lng),content:w,yAnchor:.3,zIndex:3});mks[s.n]=m;});
  document.querySelectorAll('#layers button').forEach(b=>b.addEventListener('click',()=>{
    const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const t=b.dataset.t;
    if(t==='ZONES'){zoneObjs.forEach(o=>o.setMap(on?map:null));return;}
    on?map.addOverlayMapTypeId(K.MapTypeId[t]):map.removeOverlayMapTypeId(K.MapTypeId[t]);}));
}
function select(n,scroll){
  if(cur){cards[cur].classList.remove('on');mks[cur]&&mks[cur].classList.remove('on');}
  cur=n;cards[n].classList.add('on');if(mks[n])mks[n].classList.add('on');
  const s=S.find(x=>x.n===n);if(map)map.panTo(new kakao.maps.LatLng(s.lat,s.lng));
  if(scroll)cards[n].scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- SDK 불러오기 ---------- */
if(KAKAO_JS_KEY.startsWith('YOUR'))showErr('key');
else if(location.protocol==='file:')showErr('file');
else{const sc=document.createElement('script');
  sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
  sc.onload=()=>{try{kakao.maps.load(init)}catch(e){showErr('load')}};
  sc.onerror=()=>showErr('load');document.head.appendChild(sc);}
</script>
</body>
</html>
