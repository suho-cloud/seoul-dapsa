<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2일차 서울 도보답사 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--ink:#1D2830;--muted:#5D6A70;--line:#D3DAD7;--paper:#FFFFFF;--bg:#F1F4F1;
  --stay:#1D2830;--walk:#2F70B0;--lunch:#B47A1E;--bus:#A84E86;--mark:#FFE58A;
  --f-d:"Nanum Myeongjo",serif;--f-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-m:"IBM Plex Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-b);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
#app{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:100%}
#mapwrap{position:relative;min-height:0}
#map{width:100%;height:100%}
#panel{overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:18px 16px 40px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}#mapwrap{height:60vh}#panel{border-left:0;border-top:1px solid var(--line)}}
.eyebrow{font-family:var(--f-m);font-size:11px;color:var(--muted);letter-spacing:.04em}
h1{font-family:var(--f-d);font-size:24px;line-height:1.25;margin:0}
.sub{font-size:13px;color:var(--ink);font-weight:500}
.tl{display:flex;flex:none;min-height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:#fff}
.tl i{display:block;background:var(--c);border-right:1px solid #fff;cursor:pointer}
.tlk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.tlk span{display:inline-flex;align-items:center;gap:5px}
.tlk b{width:12px;height:12px;border-radius:2px;background:var(--c);display:inline-block}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{font:500 12.5px var(--f-b);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btns button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 10px;padding:10px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.row.stay,.row.lunch,.row.bus{background:var(--paper);border-color:var(--line)}
.row.walk{padding:6px 12px;background:transparent}
.row.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.t{font:500 12px var(--f-m);color:var(--muted);font-variant-numeric:tabular-nums}
.t .d{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.what{display:flex;flex-direction:column;gap:3px;min-width:0}
.head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.num{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-m);background:var(--c);color:#fff}
.kind{font-size:11px;padding:0 7px;border-radius:99px;border:1px solid var(--c);color:var(--c);flex:none}
.place{font-weight:600}
.row.walk .place{font-weight:500;color:var(--walk);font-size:13px}
.note{font-size:13px;color:var(--muted)}
.note mark{background:var(--mark);color:var(--ink);padding:0 2px}
.links{display:flex;gap:12px;font-size:12px}
.links a{color:var(--c);font-weight:500}
.dist{font:500 11px var(--f-m);color:var(--muted)}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--f-m);border:2.5px solid #fff;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.mk.on{transform:scale(1.3)}
.mkl{font:600 12px var(--f-b);color:var(--ink);background:rgba(255,255,255,.95);padding:1px 6px;border-radius:3px;margin-top:3px;white-space:nowrap;text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.pk{width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px dashed var(--walk);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mkl.pl{font-weight:500;font-size:11px;color:var(--muted)}
#err{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);padding:24px}
#err[hidden]{display:none}
#err div{max-width:520px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 22px}
#err h2{margin:0 0 8px;font-family:var(--f-d);font-size:19px}
#err code{font-family:var(--f-m);background:var(--bg);padding:1px 5px;border-radius:3px}
</style>
</head>

 {s:"17:20",e:"17:45",k:"체류",p:"명동거리 (라인프렌즈 스퀘어 일대)",m:"25분",c:"상권 관찰, 간판 언어·굿즈 매장",n:12,at:[37.56379,126.98461],short:"명동거리"},
 {s:"17:45",e:"17:55",k:"도보",p:"→ 명동거리 → 명동역 → 남산예장공원 버스주차장",m:"10분",c:"",path:["L12"]},
 {s:"17:55",e:"18:00",k:"체류",p:"버스주차장 집결",m:"5분",c:"인원 확인",n:13,at:[37.5599,126.98896],short:"버스주차장 집결"},
 {s:"18:00",e:"",k:"버스",p:"버스 승차",m:"—",c:"남산예장공원 버스주차장 (이용 가능 여부 기사님 확인)",n:14,at:[37.55972,126.98930],short:"버스 승차"}
];
// 도보 구간에 적힌 경유지 (걸으며 지나는 곳)
const PASS=[["북촌로5길",37.57985,126.98294],["계동길",37.58059,126.98677],["귀금속거리",37.5722,126.99226],["종묘시민광장",37.57148,126.99502],["노가리골목",37.5671,126.99192],["골뱅이골목",37.56567,126.98413],["명동역",37.56091,126.98633]];
const VIEWS={A:[[37.5765,126.9790],[37.5835,126.9885]],B:[[37.5715,126.9850],[37.5755,126.9950]],C:[[37.5680,126.9890],[37.5750,126.9975]],F:[[37.5590,126.9820],[37.5690,126.9950]]};

const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function len(l){let d=0;for(let i=1;i<l.length;i++){const a=l[i-1],b=l[i],x=(b[1]-a[1])*Math.PI/180*Math.cos((a[0]+b[0])/2*Math.PI/180),y=(b[0]-a[0])*Math.PI/180;d+=6371000*Math.hypot(x,y);}return d;}
const pathOf=keys=>keys.flatMap((k,i)=>i?P[k].slice(1):P[k]);

/* ---------- 시간 막대 ---------- */
const tl=document.getElementById('tl');
ROWS.forEach((r,i)=>{if(!r.e)return;const w=toMin(r.e)-toMin(r.s);const b=document.createElement('i');b.style.flex=w+' 1 0';b.style.setProperty('--c',KC[r.k]);
  b.title=`${r.s}–${r.e} ${r.k} · ${r.p.replace(/^→ /,'')}`;b.addEventListener('click',()=>select(i,true));tl.appendChild(b);});

/* ---------- 시간표 ---------- */
const rowsEl=document.getElementById('rows');const rowEls=[];
ROWS.forEach((r,i)=>{
  const d=document.createElement('div');d.className='row '+{체류:'stay',도보:'walk',점심:'lunch',버스:'bus'}[r.k];d.style.setProperty('--c',KC[r.k]);
  const dist=r.path?`<span class="dist">실제 도보 약 ${Math.round(len(pathOf(r.path))/10)*10}m</span>`:'';
  const links=r.at?`<div class="links"><a href="https://map.kakao.com/link/map/${encodeURIComponent(r.short)},${r.at[0]},${r.at[1]}" target="_blank" rel="noopener">카카오맵에서 보기</a><a href="https://map.kakao.com/link/to/${encodeURIComponent(r.short)},${r.at[0]},${r.at[1]}" target="_blank" rel="noopener">여기로 길찾기</a></div>`:'';
  d.innerHTML=`<div class="t">${r.s}${r.e?'–'+r.e:''}<span class="d">${r.m}</span></div>
   <div class="what"><div class="head">${r.n?`<span class="num">${r.n}</span>`:''}<span class="kind">${r.k}</span><span class="place">${r.p}</span></div>
   ${r.c?`<div class="note">${r.c}</div>`:''}${dist}${links}</div>`;
  d.addEventListener('click',e=>{if(e.target.tagName!=='A')select(i,false)});rowsEl.appendChild(d);rowEls.push(d);
});

/* ---------- 오류 안내 ---------- */
function showErr(type){
  document.getElementById('err').hidden=false;
  document.getElementById('errbox').innerHTML={
   file:`<h2>파일을 더블클릭해서 열면 지도가 뜨지 않습니다</h2><p>GitHub Pages 주소(<code>https://suho-cloud.github.io/seoul-dapsa/</code>)로 여세요. 오른쪽 시간표는 그대로 볼 수 있습니다.</p>`,
   load:`<h2>카카오 지도를 불러오지 못했습니다</h2><p>① 카카오맵 사용 설정 ON ② 지금 주소 <code>${location.origin}</code>가 JavaScript 키 아래 도메인에 등록돼 있는지 ③ JavaScript 키가 맞는지 확인하세요.</p>`
  }[type];}

/* ---------- 지도 ---------- */
let map,K,mks={},lines={},cur=null;
function init(){
  K=kakao.maps;const LL=(a,b)=>new K.LatLng(a,b);
  map=new K.Map(document.getElementById('map'),{center:LL(37.5715,126.9880),level:5});
  map.addControl(new K.MapTypeControl(),K.ControlPosition.TOPRIGHT);
  map.addControl(new K.ZoomControl(),K.ControlPosition.RIGHT);
  const all=new K.LatLngBounds();
  const draw=(i,pts,inside)=>{const path=pts.map(p=>LL(p[0],p[1]));path.forEach(p=>all.extend(p));
    new K.Polyline({map,path,strokeWeight:inside?7:9,strokeColor:'#FFFFFF',strokeOpacity:.9,zIndex:1});
    const ln=new K.Polyline({map,path,strokeWeight:inside?3:5,strokeColor:inside?KH.체류:KH.도보,strokeOpacity:1,strokeStyle:inside?'shortdot':'solid',endArrow:true,zIndex:2});
    (lines[i]=lines[i]||[]).push({ln,path,inside});};
  ROWS.forEach((r,i)=>{if(r.path)draw(i,pathOf(r.path),false);if(r.inside)draw(i,pathOf(r.inside),true);});
  PASS.forEach(([n,a,b])=>{const w=document.createElement('div');w.style.cssText='display:grid;justify-items:center';
    w.innerHTML=`<div class="pk"></div><div class="mkl pl">${n}</div>`;
    new K.CustomOverlay({map,position:LL(a,b),content:w,yAnchor:.15,zIndex:3});});
  ROWS.forEach((r,i)=>{if(!r.at)return;const w=document.createElement('div');w.style.cssText='display:grid;justify-items:center';
    const m=document.createElement('div');m.className='mk';m.style.setProperty('--c',KC[r.k]);m.textContent=r.n;m.title=`${r.s} ${r.p}`;
    const l=document.createElement('div');l.className='mkl';l.textContent=r.short;w.append(m,l);
    w.addEventListener('click',()=>select(i,true));
    new K.CustomOverlay({map,position:LL(r.at[0],r.at[1]),content:w,yAnchor:.25,zIndex:r.k==='버스'?5:4});mks[i]=m;});
  const fit=v=>{if(v==='all'){map.setBounds(all,40,40,40,40);return;}map.setBounds(new K.LatLngBounds(LL(...VIEWS[v][0]),LL(...VIEWS[v][1])));};
  fit('all');
  document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>fit(b.dataset.v)));
  document.querySelectorAll('#layers button').forEach(b=>b.addEventListener('click',()=>{
    const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);
    on?map.addOverlayMapTypeId(K.MapTypeId[b.dataset.t]):map.removeOverlayMapTypeId(K.MapTypeId[b.dataset.t]);}));
}
function select(i,scroll){
  if(cur!=null){rowEls[cur].classList.remove('on');mks[cur]&&mks[cur].classList.remove('on');(lines[cur]||[]).forEach(o=>o.ln.setOptions({strokeColor:o.inside?KH.체류:KH.도보,strokeWeight:o.inside?3:5}));}
  cur=i;rowEls[i].classList.add('on');if(mks[i])mks[i].classList.add('on');
  if(map){const r=ROWS[i];
    if(lines[i]){lines[i].forEach(o=>o.ln.setOptions({strokeColor:'#E0457B',strokeWeight:o.inside?5:7}));
      const b=new K.LatLngBounds();lines[i].forEach(o=>o.path.forEach(p=>b.extend(p)));if(r.at)b.extend(new K.LatLng(r.at[0],r.at[1]));map.setBounds(b,60,60,60,60);}
    else if(r.at){map.setLevel(Math.min(map.getLevel(),4));map.panTo(new K.LatLng(r.at[0],r.at[1]));}}
  if(scroll)rowEls[i].scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- SDK ---------- */
if(location.protocol==='file:')showErr('file');
else{const sc=document.createElement('script');
  sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
  sc.onload=()=>{try{kakao.maps.load(init)}catch(e){showErr('load')}};
  sc.onerror=()=>showErr('load');document.head.appendChild(sc);}
</script>
