.card ul{margin:0;padding-left:17px;font-size:13.5px;display:grid;gap:2px}
.q{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.links{display:flex;gap:12px;font-size:12.5px}

.walk{font:500 11.5px var(--f-m);color:var(--muted);padding-left:12px;border-left:2px dotted var(--line);margin-left:11px}
.gap{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px 12px}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--f-m);border:2.5px solid #fff;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35)}

.mkl{font:600 12px var(--f-b);color:var(--ink);background:rgba(255,255,255,.94);padding:1px 6px;border-radius:3px;margin-top:3px;white-space:nowrap;text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
#err{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);padding:24px}
#err[hidden]{display:none}
#err div{max-width:520px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 22px}
#err h2{margin:0 0 8px;font-family:var(--f-d);font-size:19px}
#err code{font-family:var(--f-m);background:var(--bg);padding:1px 5px;border-radius:3px}

const VIEWS={A:[[37.5775,126.9785],[37.5850,126.9885]],C:[[37.5680,126.9875],[37.5755,126.9965]],F:[[37.5595,126.9820],[37.5670,126.9945]]};

function len(l){let d=0;for(let i=1;i<l.length;i++){const a=l[i-1],b=l[i],x=(b[1]-a[1])*Math.PI/180*Math.cos((a[0]+b[0])/2*Math.PI/180),y=(b[0]-a[0])*Math.PI/180;d+=6371000*Math.hypot(x,y);}return d;}

/* ---------- 패널 ---------- */
const tl=document.getElementById('tl');
TL.forEach(([n,m,z])=>{const d=document.createElement('div');d.className='seg'+(z?'':' mute');d.style.flex=m+' 1 0';if(z)d.style.setProperty('--c',ZC[z]);d.textContent=n;d.title=n;tl.appendChild(d);});
const list=document.getElementById('list');const cards={};let lastZ=null;
S.forEach((s,i)=>{
  if(s.z!==lastZ){lastZ=s.z;const z=ZONES[s.z];const h=document.createElement('div');h.className='zhead';h.style.setProperty('--c',ZC[s.z]);
    h.innerHTML=`<b>${z.name}</b><span>${z.time} — ${z.desc}</span>`;list.appendChild(h);}
  if(s.id==="1"){const g=document.createElement('div');g.className='gap';g.textContent='07:00–08:30 버스 이동 (의정부 숙소 → 삼청동 입구 하차)';list.appendChild(g);}
  if(s.id==="4"){const g=document.createElement('div');g.className='gap';g.textContent='11:30–12:30 점심 (안국역~낙원동 단체 식당)';list.appendChild(g);}
  if(s.leg!=null){const m=len(LEGS[s.leg]);const w=document.createElement('div');w.className='walk';w.textContent=`↓ 도보 ${Math.round(m/10)*10}m · 약 ${Math.max(3,Math.round(m/1000*15))}분`;list.appendChild(w);}
  const c=document.createElement('div');c.className='card';c.style.setProperty('--c',ZC[s.z]);
  const nm=encodeURIComponent(s.short);
  c.innerHTML=`<div class="ct"><span class="num ${s.t}">${s.id}</span><span class="cn">${s.name}</span><span class="ctime">${s.time}</span></div>
    <div class="tags">${s.tags.map(t=>`<span class="tag${t.includes('인터뷰')?' iv':''}">${t}</span>`).join('')}</div>
    <ul>${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${s.q?`<div class="q"><b>토론·관찰</b> ${s.q}</div>`:''}
    <div class="links"><a href="https://map.kakao.com/link/map/${nm},${s.lat},${s.lng}" target="_blank" rel="noopener">카카오맵에서 보기</a><a href="https://map.kakao.com/link/to/${nm},${s.lat},${s.lng}" target="_blank" rel="noopener">여기로 길찾기</a></div>`;
  c.addEventListener('click',e=>{if(e.target.tagName!=='A')select(s.id,false)});cards[s.id]=c;list.appendChild(c);
});

  document.getElementById('err').hidden=false;
  document.getElementById('errbox').innerHTML={

   load:`<h2>카카오 지도를 불러오지 못했습니다</h2><p>① 카카오맵 사용 설정 ON ② 지금 주소 <code>${location.origin}</code>가 JavaScript 키 아래 도메인에 등록돼 있는지 ③ JavaScript 키가 맞는지 확인하세요.</p>`
  }[type];}

/* ---------- 지도 ---------- */
let map,mks={},cur=null;
function init(){
  const K=kakao.maps,LL=(a,b)=>new K.LatLng(a,b);
  map=new K.Map(document.getElementById('map'),{center:LL(37.5725,126.9880),level:5});
  map.addControl(new K.MapTypeControl(),K.ControlPosition.TOPRIGHT);
  map.addControl(new K.ZoomControl(),K.ControlPosition.RIGHT);
  // 도보 경로: 바깥 흰 테두리 + 구역 색 선 + 도착 방향 화살표
  S.forEach(s=>{if(s.leg==null)return;const path=LEGS[s.leg].map(p=>LL(p[0],p[1]));
    new K.Polyline({map,path,strokeWeight:9,strokeColor:'#FFFFFF',strokeOpacity:.9,zIndex:1});
    new K.Polyline({map,path,strokeWeight:5,strokeColor:ZC[s.z],strokeOpacity:1,strokeStyle:s.t==='pass'?'shortdash':'solid',endArrow:true,zIndex:2});});
  S.forEach(s=>{const w=document.createElement('div');w.style.cssText='display:grid;justify-items:center';
    const m=document.createElement('div');m.className='mk '+s.t;m.style.setProperty('--c',ZC[s.z]);m.textContent=s.id;m.title=s.name;
    const l=document.createElement('div');l.className='mkl';l.textContent=s.short;w.append(m,l);
    w.addEventListener('click',()=>select(s.id,true));
    new K.CustomOverlay({map,position:LL(s.lat,s.lng),content:w,yAnchor:.25,zIndex:3});mks[s.id]=m;});
  const all=new K.LatLngBounds();LEGS.flat().forEach(p=>all.extend(LL(p[0],p[1])));
  const fit=v=>{if(v==='all'){map.setBounds(all,40,40,40,40);return;}const b=new K.LatLngBounds(LL(...VIEWS[v][0]),LL(...VIEWS[v][1]));map.setBounds(b);};
  fit('all');
  document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>fit(b.dataset.v)));
  document.querySelectorAll('#layers button').forEach(b=>b.addEventListener('click',()=>{
    const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);
    on?map.addOverlayMapTypeId(K.MapTypeId[b.dataset.t]):map.removeOverlayMapTypeId(K.MapTypeId[b.dataset.t]);}));
}
function select(id,scroll){
  if(cur){cards[cur].classList.remove('on');mks[cur]&&mks[cur].classList.remove('on');}
  cur=id;cards[id].classList.add('on');if(mks[id])mks[id].classList.add('on');
  const s=S.find(x=>x.id===id);if(map){map.setLevel(Math.min(map.getLevel(),4));map.panTo(new kakao.maps.LatLng(s.lat,s.lng));}
  if(scroll)cards[id].scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- SDK ---------- */
if(location.protocol==='file:')showErr('file');
else{const sc=document.createElement('script');
  sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
  sc.onload=()=>{try{kakao.maps.load(init)}catch(e){showErr('load')}};
  sc.onerror=()=>showErr('load');document.head.appendChild(sc);}
</script>
